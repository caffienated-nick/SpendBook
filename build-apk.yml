name: Build Android APK

# Runs whenever you push to main, or manually from the Actions tab
# (the "Run workflow" button) if you want to trigger a build without
# pushing new code.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Generous but bounded -- flet build apk's first-time Flutter/Android
    # SDK setup can be slow; this stops a genuinely stuck build from
    # burning your GitHub Actions minutes indefinitely.
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        # flet build apk needs a JDK; ubuntu-latest runners come with
        # Android SDK preinstalled but we pin Java explicitly to avoid
        # relying on whatever default happens to be on the image.
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project dependencies
        run: uv sync

      - name: Run tests before building
        # Fail fast: if the database layer is broken, there's no point
        # spending 15+ minutes building an APK around it.
        run: uv run pytest

      - name: Confirm Android SDK is available on this runner
        # ubuntu-latest runners come with the Android SDK preinstalled and
        # ANDROID_SDK_ROOT already set -- we just point ANDROID_HOME at
        # the same place (some tools, including Flet, look for
        # ANDROID_HOME specifically) rather than hardcoding a path that
        # could silently go stale if GitHub changes their runner image.
        run: |
          echo "ANDROID_SDK_ROOT is: $ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          ls "$ANDROID_SDK_ROOT"

      - name: Build APK
        # --yes auto-confirms the "install Flutter/Android SDK?" prompt.
        # Without it, flet build apk blocks waiting for interactive input
        # that doesn't exist in a CI environment, and fails with EOFError.
        # --no-rich-output avoids rich's progress-bar/spinner rendering,
        # which can produce garbled or unreliable output in a non-TTY
        # CI log.
        #
        # Size reduction (previous build was ~200MB):
        # --split-per-abi builds a separate, smaller APK per CPU
        # architecture instead of one "fat" APK bundling all three
        # (arm64-v8a, armeabi-v7a, x86_64). This is a real Flutter CLI
        # flag passed straight through by flet-cli, so it's much more
        # reliable than --arch, which flet-cli tries to translate into
        # an Android Gradle abiFilters config internally -- that
        # translation broke in this Flet version and produced an empty
        # ABI list, failing the build with a Gradle CXX1201 error.
        # The tradeoff: this produces 3 APK files instead of 1, so you
        # need to pick the right one for your phone (see the next step).
        # --compile-app/--compile-packages precompile .py to .pyc.
        # --cleanup-app/--cleanup-packages strip files not needed at
        # runtime (docs, tests, caches shipped inside dependencies).
        run: >
          uv run flet build apk --yes --no-rich-output
          --split-per-abi
          --compile-app --compile-packages
          --cleanup-app --cleanup-packages

      - name: Report APK sizes
        # Printed directly in the Actions log so size regressions are
        # visible on every build without needing to download the
        # artifact first. With --split-per-abi there are multiple files;
        # app-arm64-v8a-release.apk is the one that fits virtually all
        # modern Android phones.
        run: |
          echo "Built APKs (pick app-arm64-v8a-release.apk for most phones):"
          du -h build/apk/*.apk

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendbook-apk
          path: build/apk/*.apk
          # Artifacts don't need to live forever -- this is a working
          # build you'll download and install within days, not an
          # official release archive.
          retention-days: 14